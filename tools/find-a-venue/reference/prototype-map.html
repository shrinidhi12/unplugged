.sub2{display:block;font-size:.74rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis}

.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.note{color:var(--muted);font-size:.8rem;margin:8px 0 0}
ol{list-style:none;margin:0;padding:0;overflow:auto;flex:1}

.rank{font-family:var(--f-mono);color:var(--muted);font-size:.78rem;text-align:right}

.ct{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.85rem}
.bar{display:block;height:3px;border-radius:2px;margin-top:3px;opacity:.6}

  const nw=Math.min(Math.max(vb.w*f,12),420), nh=vb.h*(nw/vb.w);
  cx??=vb.x+vb.w/2; cy??=vb.y+vb.h/2;
  vb={x:cx-(cx-vb.x)*(nw/vb.w),y:cy-(cy-vb.y)*(nh/vb.h),w:nw,h:nh}; apply();
}
const toMap=(ex,ey)=>{const pt=svg.createSVGPoint();pt.x=ex;pt.y=ey;return pt.matrixTransform(svg.getScreenCTM().inverse())};
svg.addEventListener('wheel',e=>{e.preventDefault();const m=toMap(e.clientX,e.clientY);zoom(e.deltaY>0?1.15:1/1.15,m.x,m.y)},{passive:false});
const ptrs=new Map(); let last=null, pinchD=null, moved=false;
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,e);last=toMap(e.clientX,e.clientY);moved=false;svg.classList.add('drag')});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return; ptrs.set(e.pointerId,e);
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    if(pinchD){const m=toMap((a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2);zoom(pinchD/d,m.x,m.y)} pinchD=d; moved=true; return}
  const m=toMap(e.clientX,e.clientY); if(!last)return;
  const dx=m.x-last.x, dy=m.y-last.y; if(Math.abs(dx)+Math.abs(dy)>0.05)moved=true;
  vb.x-=dx; vb.y-=dy; apply(); last=toMap(e.clientX,e.clientY);
});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinchD=null;if(!ptrs.size){svg.classList.remove('drag');last=null}};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
document.getElementById('zin').onclick=()=>zoom(1/1.4);
document.getElementById('zout').onclick=()=>zoom(1.4);
document.getElementById('zreset').onclick=()=>{vb={...HOME};apply()};
new ResizeObserver(apply).observe(svg);

// legend
const chips=document.getElementById('chips');
CATS.forEach(c=>{
  if(!pts.some(p=>p.cat===c.id))return;
  const b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed','true');
  b.innerHTML=`<span class="dot ${c.id==='hood'?'hood':''}" style="background:var(--${c.id})"></span>${c.label}`;
  b.onclick=()=>{on.has(c.id)?on.delete(c.id):on.add(c.id);b.setAttribute('aria-pressed',on.has(c.id));filter()};
  chips.appendChild(b);
});
document.getElementById('size').innerHTML=`<span>Listings</span>`+[5,25,100].map(n=>{const r=baseR(n)*2.2;return `<svg width="${r*2+2}" height="${r*2+2}"><circle cx="${r+1}" cy="${r+1}" r="${r}" fill="none" stroke="currentColor"/></svg>${n}`}).join(' ');
function filter(){
  pts.forEach(p=>{const v=on.has(p.cat)&&val(p)>0;p.c.classList.toggle('dim',!v);if(p.t)p.t.style.display=v?'':'none';p.li.hidden=!v;
    p.ctEl.textContent=val(p); });
  const mx=Math.max(1,...pts.map(val));
  pts.forEach(p=>p.barEl.style.width=Math.max(4,val(p)/mx*100)+'%');
  [...pts].sort((a,b)=>val(b)-val(a)||b.refs-a.refs).forEach((p,k)=>{list.appendChild(p.li);p.li.querySelector('.rank').textContent=k+1});
  document.querySelector('.size span').textContent=ACT?'Events':'Listings';
  apply();
}

// list
const list=document.getElementById('list'), max=pts[0].refs;
pts.forEach((p,k)=>{
  const li=document.createElement('li');const b=document.createElement('button');
  b.innerHTML=`<span class="rank">${k+1}</span><span class="dot ${p.cat==='hood'?'hood':''}" style="background:var(--${p.cat})"></span>
   <span class="nm" title="${p.name}">${short(p.name)}<span class="sub2">${p.acts.slice(0,2).map(a=>a[0]).join(" · ")}</span><span class="bar" style="width:${Math.max(4,p.refs/max*100)}%;background:var(--${p.cat==='hood'?'hood':p.cat})"></span></span><span class="ct">${p.refs}</span>`; p.ctEl=b.querySelector(".ct"); p.barEl=b.querySelector(".bar");
  b.onclick=()=>select(p.i,true); li.appendChild(b); list.appendChild(li); p.li=li; p.btn=b;
});
document.getElementById('off').innerHTML=
 (D.outside.length?'<p class="outhd"><strong>Outside the city</strong> · day trips</p><ul class="outl">':'')+D.outside.map(o=>`<li><a href="https://www.openstreetmap.org/?mlat=${o.lat}&mlon=${o.lng}#map=13/${o.lat}/${o.lng}" target="_blank" rel="noopener">${short(o.name)}</a> · ${o.area} · <span class="num">${o.refs}</span> listings · ${o.series.map(s=>s[0]).join(', ')}</li>`).join('')+(D.outside.length?'</ul>':'')+
 '<details><summary><strong>Not on the map ('+D.unmapped.length+')</strong></summary>'+D.unmapped.map(u=>`${short(u.name)} (${u.refs})`).join(', ')+
 '. The newsletter never published a street address for these, and I couldn\'t find one. Private addresses shared only by email or RSVP are left off.</details>';

// selection
const card=document.getElementById('card');
let cur=null;
function select(i,fly){
  const p=pts[i]; if(cur!=null){pts[cur].c.classList.remove('sel');pts[cur].btn.removeAttribute('aria-current')}
  cur=i; p.c.classList.add('sel'); p.c.parentNode.appendChild(p.c); p.btn.setAttribute('aria-current','true');
  if(!fly) p.btn.scrollIntoView({block:'nearest'});
  if(fly){const w=Math.min(vb.w,60),h=vb.h*(w/vb.w);vb={x:p.x-w/2,y:p.y-h/2,w,h};apply()}
  const osm=`https://www.openstreetmap.org/?mlat=${p.lat}&mlon=${p.lng}#map=${p.prec==='exact'?17:15}/${p.lat}/${p.lng}`;
  const prec = p.prec==='exact'?'':(p.prec==='hood'?'<p class="note">Organizers share the address by email or RSVP. The circle marks the neighborhood, not a building.</p>':'<p class="note">Pin placed at the neighborhood; the newsletter gives no street address.</p>');
  card.innerHTML=`<div class="eyebrow">${p.type}</div><h2>${p.name}</h2>
   <dl class="stats">
    <dt>Listings</dt><dd><span class="num">${p.refs}</span> in <span class="num">${p.issues}</span> issues</dd>
    <dt>First seen</dt><dd>${p.first} issue</dd>
    <dt>Latest</dt><dd>${p.last} issue · ${p.lastEvent}</dd>
    <dt>Activities</dt><dd><div class="tags">${p.acts.map(([t,c])=>`<span class="tag" style="--accent-c:var(--${p.cat})">${t}<b>${c}</b></span>`).join("")}</div></dd>
    <dt>Signature events</dt><dd><ul class="sig">${p.series.map(([e,c])=>`<li>${e}${c>1?` <span class="num">×${c}</span>`:""}</li>`).join("")}</ul></dd>
    <dt>Top host</dt><dd>${p.host} <span class="num" style="color:var(--muted)">(${p.hostShare})</span></dd>
    <dt>Area</dt><dd>${p.area}</dd>
   </dl>${prec}<p class="note"><a href="${osm}" target="_blank" rel="noopener">Open in OpenStreetMap ↗</a></p>`;
}
const actTot={};pts.forEach(p=>Object.entries(p.all).forEach(([t,c])=>actTot[t]=(actTot[t]||0)+c));
const sel=document.getElementById('act');
Object.entries(actTot).sort((a,b)=>b[1]-a[1]).forEach(([t,c])=>{const o=document.createElement('option');o.value=t;o.textContent=`${t} (${c})`;sel.appendChild(o)});
sel.onchange=()=>{ACT=sel.value;filter();const top=[...pts].filter(p=>on.has(p.cat)).sort((a,b)=>val(b)-val(a))[0];if(top&&val(top))select(top.i,false)};
filter(); select(0,false);
</script>
