# Pulls the Find a venue collaborator sheet from Grist and publishes it.
#
# Runs every morning, or on demand from the Actions tab ("Run workflow").
# If any Approved venue changed, it commits src/data/venues.json to main;
# Netlify deploys that push. Problems in the sheet fail the run and nothing
# is published. Setup: tools/find-a-venue/README.md ("Grist").
name: Sync venues from Grist

on:
  schedule:
    - cron: "0 10 * * *" # 10:00 UTC = 6am New York (5am in winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: venues-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Explicit bash turns on pipefail, so a failed sync | tee fails the run.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl==3.1.5

      - name: Sync from Grist
        env:
          GRIST_DOC_ID: ${{ secrets.GRIST_DOC_ID }}
          GRIST_API_KEY: ${{ secrets.GRIST_API_KEY }}
          GRIST_SERVER: ${{ vars.GRIST_SERVER || 'https://docs.getgrist.com' }}
        run: |
          python tools/find-a-venue/sync.py --grist | tee sync.log
          { echo '```'; cat sync.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Privacy test
        run: python tools/find-a-venue/test_privacy.py

      - name: Commit changes
        run: |
          files="src/data/venues.json tools/find-a-venue/data/geocode_cache.json tools/find-a-venue/data/off_tech_history.csv"
          if git diff --quiet -- $files; then
            echo "No venue changes; nothing to publish." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "venues-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          git commit -m "Sync venues from Grist"
          git push
